<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; form-action 'none'; img-src 'none'; connect-src 'none';"
    >
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Freedom Wallet Approval</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f8f7f3;
        color: #1f2428;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: stretch;
        background: #f8f7f3;
      }

      main {
        width: 100%;
        padding: 24px;
        display: flex;
        flex-direction: column;
        gap: 18px;
      }

      h1 {
        margin: 0;
        font-size: 20px;
        line-height: 1.25;
        font-weight: 650;
      }

      p {
        margin: 0;
        font-size: 13px;
        line-height: 1.5;
        color: #4a5258;
      }

      dl {
        margin: 0;
        padding: 12px;
        border: 1px solid #ddd8ce;
        border-radius: 6px;
        background: #fffdfa;
        display: grid;
        grid-template-columns: 92px minmax(0, 1fr);
        gap: 8px 10px;
        font-size: 12px;
      }

      dl[hidden] {
        display: none;
      }

      dt {
        color: #697176;
      }

      dd {
        margin: 0;
        min-width: 0;
        overflow-wrap: anywhere;
        color: #1f2428;
      }

      fieldset {
        margin: 0;
        padding: 0;
        border: 0;
      }

      fieldset[hidden] {
        display: none;
      }

      legend {
        margin: 0 0 8px;
        padding: 0;
        font-size: 12px;
        font-weight: 650;
        color: #1f2428;
      }

      .account-choice-list {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .account-choice {
        display: grid;
        grid-template-columns: 18px minmax(0, 1fr);
        gap: 10px;
        align-items: start;
        padding: 10px 12px;
        border: 1px solid #ddd8ce;
        border-radius: 6px;
        background: #fffdfa;
        cursor: pointer;
      }

      .account-choice input {
        margin: 2px 0 0;
      }

      .account-choice-body {
        min-width: 0;
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 3px 8px;
        align-items: center;
      }

      .account-choice-title {
        min-width: 0;
        overflow-wrap: anywhere;
        font-size: 13px;
        font-weight: 650;
      }

      .account-choice-meta {
        min-width: 0;
        overflow-wrap: anywhere;
        grid-column: 1 / -1;
        font-family: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace;
        font-size: 11px;
        color: #697176;
      }

      .account-choice-badge {
        padding: 2px 6px;
        border-radius: 999px;
        background: #e9f0ff;
        color: #244a8f;
        font-size: 11px;
        font-weight: 650;
      }

      .notice {
        padding: 10px 12px;
        border: 1px solid #d8c79a;
        border-radius: 6px;
        background: #fff8df;
        color: #463915;
        font-size: 12px;
        line-height: 1.45;
      }

      .error {
        min-height: 18px;
        margin-top: auto;
        font-size: 12px;
        color: #a0182b;
      }

      .actions {
        display: flex;
        justify-content: flex-end;
        gap: 8px;
      }

      button {
        min-height: 34px;
        min-width: 84px;
        border-radius: 6px;
        border: 1px solid #bdb6ad;
        padding: 7px 14px;
        font: inherit;
        font-size: 13px;
        font-weight: 600;
        background: #ffffff;
        color: #1f2428;
      }

      button.primary {
        border-color: #1f5fda;
        background: #1f5fda;
        color: #ffffff;
      }

      button:disabled {
        opacity: 0.58;
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1 id="heading">Review wallet request</h1>
        <p id="summary"></p>
      </header>

      <dl id="details" hidden></dl>

      <fieldset id="account-choices" hidden>
        <legend>Account to share</legend>
        <div id="account-choice-list" class="account-choice-list"></div>
      </fieldset>

      <p id="notice" class="notice">Approve only if this request matches what you intended.</p>

      <div id="error" class="error" role="alert" aria-live="polite"></div>
      <div class="actions">
        <button id="reject" type="button">Reject</button>
        <button id="accept" class="primary" type="button">Approve</button>
      </div>
    </main>

    <script src="./trusted-wallet-approval-renderer.js"></script>
  </body>
</html>
