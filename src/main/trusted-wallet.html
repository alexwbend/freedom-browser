<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Freedom Wallet</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        --wallet-bg: #f8f7f3;
        --wallet-panel: #ffffff;
        --wallet-panel-subtle: #fffdfa;
        --wallet-export-bg: #fff9f7;
        --wallet-error-bg: #fff3f1;
        --wallet-text: #171717;
        --wallet-muted: #5d5a52;
        --wallet-muted-2: #68645c;
        --wallet-border: #dedbd2;
        --wallet-border-strong: #c8c3b8;
        --wallet-danger-border: #d8a39b;
        --wallet-danger-text: #8f2f24;
        --wallet-accent: #2f7d59;
        --wallet-badge-bg: #e6f2ec;
        --wallet-badge-text: #1c5d3f;
        --wallet-button-hover: #efede7;
        background: var(--wallet-bg);
        color: var(--wallet-text);
      }

      :root[data-theme="dark"] {
        color-scheme: dark;
        --wallet-bg: #171717;
        --wallet-panel: #22211f;
        --wallet-panel-subtle: #1d1c1a;
        --wallet-export-bg: #261c1a;
        --wallet-error-bg: #2a1d1b;
        --wallet-text: #f4f1ea;
        --wallet-muted: #b6b0a5;
        --wallet-muted-2: #a39c91;
        --wallet-border: #3d3932;
        --wallet-border-strong: #5b554c;
        --wallet-danger-border: #8f4d43;
        --wallet-danger-text: #ffb0a6;
        --wallet-accent: #6fca96;
        --wallet-badge-bg: #20392e;
        --wallet-badge-text: #a6e3c4;
        --wallet-button-hover: #302d28;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: var(--wallet-bg);
        color: var(--wallet-text);
      }

      main {
        display: grid;
        gap: 24px;
        padding: 28px;
      }

      header {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 18px;
        border-bottom: 1px solid var(--wallet-border);
        padding-bottom: 18px;
      }

      h1 {
        margin: 0;
        font-size: 24px;
        font-weight: 700;
      }

      h2 {
        margin: 0 0 12px;
        font-size: 15px;
        font-weight: 700;
        text-transform: uppercase;
      }

      p {
        margin: 4px 0 0;
        color: var(--wallet-muted);
        font-size: 13px;
      }

      .grid {
        display: grid;
        grid-template-columns: minmax(260px, 0.8fr) minmax(340px, 1.2fr);
        gap: 20px;
      }

      section {
        min-width: 0;
      }

      ul {
        display: grid;
        gap: 10px;
        list-style: none;
        margin: 0;
        padding: 0;
      }

      .item-row {
        display: flex;
        align-items: flex-start;
        flex-wrap: wrap;
        justify-content: space-between;
        gap: 16px;
        border: 1px solid var(--wallet-border);
        border-radius: 8px;
        background: var(--wallet-panel);
        padding: 14px;
      }

      .item-row.active {
        border-color: var(--wallet-accent);
      }

      .row-main {
        flex: 1 1 220px;
        min-width: 180px;
      }

      .item-title {
        font-size: 14px;
        font-weight: 650;
        overflow-wrap: anywhere;
      }

      .item-meta {
        margin-top: 4px;
        color: var(--wallet-muted-2);
        font-size: 12px;
        overflow-wrap: anywhere;
      }

      .mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      }

      .badge {
        flex: none;
        border-radius: 999px;
        background: var(--wallet-badge-bg);
        color: var(--wallet-badge-text);
        font-size: 12px;
        font-weight: 700;
        padding: 5px 9px;
      }

      .secondary-button,
      .close-button {
        border: 1px solid var(--wallet-border-strong);
        border-radius: 7px;
        background: var(--wallet-panel);
        color: var(--wallet-text);
        cursor: pointer;
        font: inherit;
        font-size: 13px;
        font-weight: 650;
        padding: 8px 12px;
      }

      .secondary-button:hover,
      .close-button:hover {
        background: var(--wallet-button-hover);
      }

      .secondary-button:disabled {
        cursor: default;
        opacity: 0.55;
      }

      .row-actions {
        align-items: center;
        display: flex;
        flex: 1 1 260px;
        flex-wrap: wrap;
        gap: 8px;
        justify-content: flex-end;
      }

      .export-panel {
        border: 1px solid var(--wallet-danger-border);
        border-radius: 8px;
        background: var(--wallet-export-bg);
        display: grid;
        gap: 12px;
        margin-top: 14px;
        padding: 14px;
      }

      .management-panel {
        border: 1px solid var(--wallet-border);
        border-radius: 8px;
        background: var(--wallet-panel-subtle);
        display: grid;
        gap: 12px;
        margin-bottom: 14px;
        padding: 14px;
      }

      .export-panel h3 {
        font-size: 14px;
        margin: 0;
      }

      .management-panel h3 {
        font-size: 14px;
        margin: 0;
      }

      .field {
        display: grid;
        gap: 6px;
      }

      .field label {
        color: var(--wallet-muted);
        font-size: 12px;
        font-weight: 700;
        text-transform: uppercase;
      }

      .field input {
        border: 1px solid var(--wallet-border-strong);
        border-radius: 7px;
        background: var(--wallet-panel);
        color: var(--wallet-text);
        font: inherit;
        padding: 9px 10px;
      }

      .button-row {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .inline-form {
        display: grid;
        gap: 8px;
      }

      .secret-value {
        background: var(--wallet-panel);
        border: 1px solid var(--wallet-border);
        border-radius: 7px;
        display: block;
        font-size: 12px;
        line-height: 1.45;
        max-width: 100%;
        overflow-wrap: anywhere;
        padding: 10px;
      }

      .empty {
        border: 1px dashed var(--wallet-border-strong);
        border-radius: 8px;
        color: var(--wallet-muted-2);
        padding: 16px;
      }

      .error {
        border: 1px solid var(--wallet-danger-border);
        border-radius: 8px;
        background: var(--wallet-error-bg);
        color: var(--wallet-danger-text);
        padding: 12px;
      }

      @media (max-width: 760px) {
        main {
          padding: 20px;
        }

        header,
        .grid,
        .item-row {
          grid-template-columns: 1fr;
        }

        header,
        .item-row {
          align-items: stretch;
        }

        .row-actions {
          align-items: flex-start;
          flex-wrap: wrap;
        }

        .grid {
          display: grid;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <div>
          <h1 id="heading">Wallet Accounts</h1>
          <p id="package-label">Shell-owned trusted surface</p>
        </div>
        <button type="button" class="close-button" id="close">Close</button>
      </header>

      <div class="error" id="error" hidden></div>

      <div class="grid">
        <section aria-labelledby="wallets-title">
          <h2 id="wallets-title">Accounts</h2>
          <div class="management-panel">
            <h3>Create wallet</h3>
            <div class="inline-form">
              <div class="field">
                <label for="create-wallet-name">Wallet name</label>
                <input id="create-wallet-name" type="text" autocomplete="off" maxlength="80" placeholder="Savings">
              </div>
              <div class="button-row">
                <button type="button" class="secondary-button" id="create-wallet-submit">Create wallet</button>
              </div>
            </div>
            <div class="error" id="management-error" hidden></div>
          </div>
          <div class="empty" id="wallet-empty" hidden>No wallet accounts are available.</div>
          <ul id="wallet-list"></ul>
          <div class="item-row">
            <div>
              <div class="item-title">Recovery Phrase</div>
              <div class="item-meta">Export the vault seed phrase from this trusted shell window.</div>
            </div>
            <button type="button" class="secondary-button" id="export-mnemonic-open">Export phrase</button>
          </div>
          <div class="export-panel" id="export-panel" hidden>
            <h3 id="export-title">Export private key</h3>
            <p id="export-address"></p>
            <div class="field">
              <label for="export-password">Vault password</label>
              <input id="export-password" type="password" autocomplete="current-password">
            </div>
            <div class="button-row">
              <button type="button" class="secondary-button" id="export-submit">Export</button>
              <button type="button" class="secondary-button" id="export-cancel">Cancel</button>
            </div>
            <div class="error" id="export-error" hidden></div>
            <div class="field" id="export-result" hidden>
              <label id="export-result-label">Private key</label>
              <code class="secret-value mono" id="export-value"></code>
              <button type="button" class="secondary-button" id="export-copy">Copy</button>
            </div>
          </div>
        </section>

        <section aria-labelledby="permissions-title">
          <h2 id="permissions-title">Connected Sites</h2>
          <div class="empty" id="permission-empty" hidden>No sites have wallet access.</div>
          <ul id="permission-list"></ul>
        </section>
      </div>
    </main>
    <script src="./trusted-wallet-renderer.js"></script>
  </body>
</html>
