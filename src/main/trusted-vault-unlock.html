<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; form-action 'none'; img-src 'none'; connect-src 'none';"
    >
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Freedom Vault Unlock</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f8f7f3;
        color: #1f2428;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: stretch;
        background: #f8f7f3;
      }

      main {
        width: 100%;
        padding: 24px;
        display: flex;
        flex-direction: column;
        gap: 18px;
      }

      h1 {
        margin: 0;
        font-size: 20px;
        line-height: 1.25;
        font-weight: 650;
      }

      p {
        margin: 0;
        font-size: 13px;
        line-height: 1.5;
        color: #4a5258;
      }

      dl {
        margin: 0;
        padding: 12px;
        border: 1px solid #ddd8ce;
        border-radius: 6px;
        background: #fffdfa;
        display: grid;
        grid-template-columns: 84px minmax(0, 1fr);
        gap: 8px 10px;
        font-size: 12px;
      }

      dl[hidden] {
        display: none;
      }

      dt {
        color: #697176;
      }

      dd {
        margin: 0;
        min-width: 0;
        overflow-wrap: anywhere;
        color: #1f2428;
      }

      form {
        margin-top: auto;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      label {
        font-size: 12px;
        font-weight: 600;
        color: #363d42;
      }

      input {
        width: 100%;
        height: 38px;
        border: 1px solid #c7c1b8;
        border-radius: 6px;
        padding: 0 10px;
        font: inherit;
        font-size: 14px;
        background: #ffffff;
        color: #1f2428;
      }

      input:focus {
        outline: 2px solid #2f6fed;
        outline-offset: 1px;
        border-color: #2f6fed;
      }

      .error {
        min-height: 18px;
        font-size: 12px;
        color: #a0182b;
      }

      .actions {
        display: flex;
        justify-content: flex-end;
        gap: 8px;
      }

      button {
        height: 34px;
        min-width: 84px;
        border-radius: 6px;
        border: 1px solid #bdb6ad;
        padding: 0 14px;
        font: inherit;
        font-size: 13px;
        font-weight: 600;
        background: #ffffff;
        color: #1f2428;
      }

      button.primary {
        border-color: #1f5fda;
        background: #1f5fda;
        color: #ffffff;
      }

      button:disabled {
        opacity: 0.58;
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1 id="heading">Unlock vault</h1>
        <p id="summary"></p>
      </header>

      <dl id="details" hidden></dl>

      <form id="unlock-form">
        <label for="password">Vault password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" autofocus>
        <div id="error" class="error" role="alert" aria-live="polite"></div>
        <div class="actions">
          <button id="cancel" type="button">Cancel</button>
          <button id="submit" class="primary" type="submit">Unlock</button>
        </div>
      </form>
    </main>

    <script src="./trusted-vault-unlock-renderer.js"></script>
  </body>
</html>
