<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Freedom Shell Rail</title>
    <link rel="stylesheet" href="./surface-rail.css">
  </head>
  <body>
    <nav class="surface-rail" aria-label="Freedom shell surfaces">
      <div class="surface-rail-group">
        <button
          type="button"
          class="surface-rail-button surface-rail-toggle"
          data-rail-toggle
          aria-label="Open Wallet sidebar"
          title="Open Wallet sidebar"
        >
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <rect x="3" y="4" width="18" height="16" rx="2"/>
            <path d="M15 4v16"/>
          </svg>
        </button>

        <div class="surface-rail-separator" aria-hidden="true"></div>

        <button
          type="button"
          class="surface-rail-button"
          data-rail-surface="wallet"
          aria-label="Open Wallet"
          title="Open Wallet"
          aria-pressed="false"
        >
          <svg
            viewBox="-4 -1 81 80"
            fill="none"
            stroke="currentColor"
            stroke-width="1.25"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M2.5 23.277C2.5 22.7247 2.94772 22.277 3.5 22.277H65.5C68.2614 22.277 70.5 24.5156 70.5 27.277V64.277C70.5 67.0384 68.2614 69.277 65.5 69.277H3.5C2.94772 69.277 2.5 68.8293 2.5 68.277V23.277Z" vector-effect="non-scaling-stroke"/>
            <path d="M52.7354 2.82857L2.96783 21.6005C2.68632 21.7067 2.5 21.9761 2.5 22.277H59.5V7.50684C59.5 4.01172 56.0056 1.59507 52.7354 2.82857Z" vector-effect="non-scaling-stroke"/>
            <path d="M70.5 52.277C70.5 52.8293 70.0523 53.277 69.5 53.277H45.5C42.7386 53.277 40.5 51.0384 40.5 48.277V43.277C40.5 40.5156 42.7386 38.277 45.5 38.277H69.5C70.0523 38.277 70.5 38.7247 70.5 39.277V52.277Z" vector-effect="non-scaling-stroke"/>
          </svg>
        </button>

        <button
          type="button"
          class="surface-rail-button surface-rail-stub"
          data-rail-stub="profile"
          aria-disabled="true"
          aria-label="Profile"
          tabindex="-1"
          title="Profile"
        >
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <circle cx="12" cy="8" r="4"/>
            <path d="M5 20a7 7 0 0 1 14 0"/>
          </svg>
        </button>

        <button
          type="button"
          class="surface-rail-button surface-rail-stub"
          data-rail-stub="nodes"
          aria-disabled="true"
          aria-label="Nodes"
          tabindex="-1"
          title="Nodes"
        >
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <circle cx="6" cy="6" r="3"/>
            <circle cx="18" cy="6" r="3"/>
            <circle cx="12" cy="18" r="3"/>
            <path d="m8.5 8.5 2 6"/>
            <path d="m15.5 8.5-2 6"/>
            <path d="M9 6h6"/>
          </svg>
        </button>

        <button
          type="button"
          class="surface-rail-button"
          data-rail-command="show-launcher"
          aria-label="Apps"
          title="Apps"
        >
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <rect x="4" y="4" width="6" height="6" rx="1"/>
            <rect x="14" y="4" width="6" height="6" rx="1"/>
            <rect x="4" y="14" width="6" height="6" rx="1"/>
            <rect x="14" y="14" width="6" height="6" rx="1"/>
          </svg>
        </button>
      </div>

      <div class="surface-rail-group surface-rail-bottom">
        <button
          type="button"
          class="surface-rail-button surface-rail-stub"
          data-rail-stub="settings"
          aria-disabled="true"
          aria-label="Settings"
          tabindex="-1"
          title="Settings"
        >
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Z"/>
            <path d="M19.4 15a1.7 1.7 0 0 0 .34 1.88l.05.05a2 2 0 1 1-2.83 2.83l-.05-.05A1.7 1.7 0 0 0 15 19.4a1.7 1.7 0 0 0-1 .6l-.12.18a2 2 0 0 1-3.76 0L10 20a1.7 1.7 0 0 0-1-.6 1.7 1.7 0 0 0-1.88.34l-.05.05a2 2 0 1 1-2.83-2.83l.05-.05A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-.6-1l-.18-.12a2 2 0 0 1 0-3.76L4 10a1.7 1.7 0 0 0 .6-1 1.7 1.7 0 0 0-.34-1.88l-.05-.05a2 2 0 1 1 2.83-2.83l.05.05A1.7 1.7 0 0 0 9 4.6a1.7 1.7 0 0 0 1-.6l.12-.18a2 2 0 0 1 3.76 0L14 4a1.7 1.7 0 0 0 1 .6 1.7 1.7 0 0 0 1.88-.34l.05-.05a2 2 0 1 1 2.83 2.83l-.05.05A1.7 1.7 0 0 0 19.4 9c.1.39.31.73.6 1l.18.12a2 2 0 0 1 0 3.76L20 14c-.29.27-.5.61-.6 1Z"/>
          </svg>
        </button>
      </div>
    </nav>
    <script src="./surface-rail.js"></script>
  </body>
</html>
